<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกข้อมูลสุขภาพชุมชน (อสม.)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">

    <div class="max-w-7xl mx-auto px-3 py-4 sm:px-4 sm:py-8">
        <!-- Header -->
        <header class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6 mb-6 flex flex-col gap-4">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-blue-600">🏥 ระบบบันทึกและติดตามสุขภาพ (อสม.)</h1>
                <p class="text-xs sm:text-sm text-slate-500">ลงพื้นที่กรอกข้อมูลสุขภาพประชาชนรายบุคคล</p>
            </div>
            <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
                <a href="asom.html" class="py-2.5 rounded-lg font-medium text-xs sm:text-sm text-center transition bg-white text-blue-600 shadow-sm">แบบฟอร์มบันทึก</a>
                <a href="nurse.html" class="py-2.5 rounded-lg font-medium text-xs sm:text-sm text-center transition text-slate-600 hover:text-slate-900">🔒 โซนพยาบาล</a>
            </div>
        </header>

        <!-- Form Section (อสม.) -->
        <main class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-8">
            <form id="healthForm" onsubmit="saveData(event)" class="space-y-5">
                <div class="bg-white p-2 sm:p-4 rounded-xl">
                    <h3 class="text-base sm:text-lg font-semibold text-slate-800 mb-4">🩺 ฟอร์มบันทึกข้อมูลสุขภาพ</h3>
                    
                    <!-- แถวที่ 1: เลือกหมู่ที่ และ ชื่อ-นามสกุล -->
                    <div class="space-y-4 mb-4">
                        <div>
                            <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">เลือกหมู่ที่ *</label>
                            <select id="selectVillage" onchange="filterPatientsByVillage()" class="w-full border border-slate-300 rounded-xl p-3 bg-white text-sm sm:text-base">
                                <option value="">-- กำลังโหลดข้อมูลหมู่... --</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">ชื่อ - นามสกุล *</label>
                            <select id="selectPatient" onchange="autoFillPatientData()" class="w-full border border-slate-300 rounded-xl p-3 bg-white text-sm sm:text-base" disabled>
                                <option value="">-- กรุณาเลือกหมู่ก่อน --</option>
                            </select>
                        </div>
                    </div>

                    <!-- แถวที่ 2: PID, อายุ, บ้านเลขที่, หมู่/ตำบล -->
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div>
                            <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">PID / บัตรประชาชน</label>
                            <input type="text" id="idCard" readonly class="w-full bg-slate-100 border border-slate-300 rounded-xl p-2.5 text-xs sm:text-sm text-slate-600 cursor-not-allowed">
                        </div>
                        <div>
                            <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">อายุ (ปี)</label>
                            <input type="text" id="age" readonly class="w-full bg-slate-100 border border-slate-300 rounded-xl p-2.5 text-xs sm:text-sm text-slate-600 cursor-not-allowed">
                        </div>
                        <div>
                            <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">บ้านเลขที่</label>
                            <input type="text" id="houseNo" readonly class="w-full bg-slate-100 border border-slate-300 rounded-xl p-2.5 text-xs sm:text-sm text-slate-600 cursor-not-allowed">
                        </div>
                        <div>
                            <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">หมู่ / ตำบล</label>
                            <input type="text" id="villageAndSubdistrict" readonly class="w-full bg-slate-100 border border-slate-300 rounded-xl p-2.5 text-xs sm:text-sm text-slate-600 cursor-not-allowed">
                        </div>
                    </div>

                    <!-- แถวที่ 3: น้ำหนัก, ส่วนสูง, ความดัน 2 ครั้ง, ชีพจร, น้ำตาล (FBS) -->
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-4">
                        <div>
                            <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">น้ำหนัก (กก.)</label>
                            <input type="number" step="0.1" id="weight" placeholder="0.0" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">ส่วนสูง (ซม.)</label>
                            <input type="number" id="height" placeholder="0" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">BP ครั้งที่ 1</label>
                            <input type="text" id="bp1" placeholder="120/80" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">BP ครั้งที่ 2</label>
                            <input type="text" id="bp2" placeholder="118/78" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">ชีพจร (ครั้ง/น.)</label>
                            <input type="number" id="pulse" placeholder="72" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">FBS (มก./ดล.)</label>
                            <input type="number" id="fbs" placeholder="100" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm">
                        </div>
                    </div>

                    <!-- แถวที่ 4: พฤติกรรม และ วันที่นัดหมาย -->
                    <div class="space-y-4 mb-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">การสูบบุหรี่</label>
                                <select id="smoking" class="w-full border border-slate-300 rounded-xl p-3 bg-white text-sm">
                                    <option value="ไม่สูบ">ไม่สูบ</option>
                                    <option value="สูบบุหรี่เป็นครั้งคราว">สูบบุหรี่เป็นครั้งคราว</option>
                                    <option value="สูบเป็นประจำ">สูบเป็นประจำ</option>
                                    <option value="เลิกสูบแล้ว">เลิกสูบแล้ว</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">การดื่มสุรา</label>
                                <select id="drinking" class="w-full border border-slate-300 rounded-xl p-3 bg-white text-sm">
                                    <option value="ไม่ดื่ม">ไม่ดื่ม</option>
                                    <option value="ดื่มเป็นครั้งคราว">ดื่มเป็นครั้งคราว</option>
                                    <option value="ดื่มเป็นประจำ">ดื่มเป็นประจำ</option>
                                    <option value="เลิกดื่มแล้ว">เลิกดื่มแล้ว</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">วันที่นัดหมายครั้งถัดไป</label>
                            <input type="date" id="nextAppointmentDate" class="w-full border border-slate-300 rounded-xl p-3 text-sm">
                        </div>
                    </div>

                    <!-- ปุ่มกดบันทึก -->
                    <div class="flex flex-col-reverse sm:flex-row justify-end gap-3 pt-2">
                        <button type="reset" class="w-full sm:w-auto bg-slate-100 text-slate-600 px-5 py-3 rounded-xl hover:bg-slate-200 transition text-sm font-medium">ล้างข้อมูล</button>
                        <button type="submit" id="btnSubmit" class="w-full sm:w-auto bg-emerald-600 text-white px-6 py-3 rounded-xl hover:bg-emerald-700 transition shadow-sm text-sm font-medium">💾 บันทึกข้อมูลเข้า Cloud</button>
                    </div>
                </div>
            </form>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
